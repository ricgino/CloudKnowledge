<main class="app-shell">
  <header class="topbar">
    <div>
      <p class="brand-kicker">CloudKnowledge</p>
      <h1>Private knowledge, securely searchable.</h1>
    </div>

    @if (loggedIn) {
      <button
        type="button"
        class="signout-button"
        (click)="logout()">
        Sign out
      </button>
    }
  </header>

  @if (!loggedIn) {
    <section class="signin-card">
      <p class="eyebrow">Secure workspace</p>
      <h2>Sign in to your knowledge base</h2>
      <p>
        Access your private documents, team shares and permission-aware AI search.
      </p>

      <button
        type="button"
        class="primary-button"
        (click)="login()">
        Sign in with Microsoft
      </button>
    </section>
  }

  @if (loggedIn) {
    <app-documents-page></app-documents-page>
  }

  <router-outlet></router-outlet>
</main>
