<h1>CloudKnowledge</h1>

@if (!loggedIn) {
  <button (click)="login()">
    Sign in
  </button>
}

@if (loggedIn) {
  <p>
    Authenticated with Microsoft Entra External ID.
  </p>

  <button (click)="showAccessTokenClaims()">
    Show safe token claims
  </button>

  <button (click)="loadDocuments()">
    Call CloudKnowledge API
  </button>

  <button (click)="createTestTeam()">
    Create test team
  </button>

  <button (click)="logout()">
    Sign out
  </button>

  <button (click)="addTestMember()">
    Add test member
  </button>

  <input
    type="file"
    (change)="onFileSelected($event)"
  />

  <button (click)="uploadDocument()">
    Upload document
  </button>

  <button (click)="shareTestDocument()">
    Share test document
  </button>

  <button (click)="unshareTestDocument()">
    Unshare test document
  </button>

  <button (click)="searchTestDocument()">
    Search test document
  </button>

  <button (click)="askTestDocument()">
    Ask test document
  </button>
}

@if (tokenClaims) {
  <h2>Access token claims</h2>

  <pre>{{ tokenClaims | json }}</pre>
}

@if (apiResult) {
  <h2>API response</h2>

  <pre>{{ apiResult }}</pre>
}

<router-outlet></router-outlet>
