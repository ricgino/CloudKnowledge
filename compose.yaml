services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: cloudknowledge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    container_name: cloudknowledge-azurite
    command: >
      azurite-blob
      --blobHost 0.0.0.0
      --blobPort 10000
      --location /data
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cloudknowledge-servicebus-sql
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    networks:
      - servicebus

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: cloudknowledge-servicebus
    volumes:
      - ./infra/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      ACCEPT_EULA: ${ACCEPT_EULA}
      EMULATOR_HTTP_PORT: 5300
    depends_on:
      - mssql
    networks:
      - servicebus

  api:
    build:
      context: .
      dockerfile: src/CloudKnowledge.Api/Dockerfile
    container_name: cloudknowledge-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Storage__ConnectionString: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      Storage__ContainerName: documents
      Messaging__ConnectionString: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Messaging__QueueName: document-processing
      Ai__BaseUrl: http://host.docker.internal:11434
      Ai__EmbeddingModel: nomic-embed-text-v2-moe
      Ai__AnswerModel: qwen3:4b
      Ai__EmbeddingDimensions: 768
      Cors__AllowedOrigins__0: http://localhost:4200
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
      servicebus:
        condition: service_started
    networks:
      - default
      - servicebus

  worker:
    build:
      context: .
      dockerfile: src/CloudKnowledge.Worker/Dockerfile
    container_name: cloudknowledge-worker
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Storage__ConnectionString: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      Storage__ContainerName: documents
      Messaging__ConnectionString: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Messaging__QueueName: document-processing
      Messaging__MaxDeliveryCount: 3
      Messaging__StartupRetrySeconds: 5
      Ai__BaseUrl: http://host.docker.internal:11434
      Ai__EmbeddingModel: nomic-embed-text-v2-moe
      Ai__EmbeddingDimensions: 768
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
      servicebus:
        condition: service_started
    networks:
      - default
      - servicebus

  web:
    build:
      context: .
      dockerfile: src/CloudKnowledge.Web/Dockerfile
    container_name: cloudknowledge-web
    ports:
      - "4200:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  azurite_data:

networks:
  servicebus:
