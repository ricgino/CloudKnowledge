name: Azure Deployment

on:
  push:
    tags:
      - "azure-plan-*"
      - "azure-apply-*"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the Terraform plan after review"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudknowledge-azure-demo
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Azure demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: azure-demo

    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_TF_STATE_STORAGE_ACCOUNT: ${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}
      AZURE_TF_STATE_CONTAINER: ${{ vars.AZURE_TF_STATE_CONTAINER }}
      AZURE_TF_STATE_KEY: ${{ vars.AZURE_TF_STATE_KEY }}
      AZURE_AD_TENANT_ID: ${{ vars.AZURE_AD_TENANT_ID }}
      AZURE_AD_API_CLIENT_ID: ${{ vars.AZURE_AD_API_CLIENT_ID }}
      AI_PROVIDER: "OpenAI"
      AI_ENDPOINT: "https://api.openai.com/"
      AI_EMBEDDING_MODEL: "text-embedding-3-small"
      AI_ANSWER_MODEL: "gpt-4.1-nano"
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}

      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_acr_name: ${{ vars.AZURE_ACR_NAME }}
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      TF_VAR_azure_ad_tenant_id: ${{ vars.AZURE_AD_TENANT_ID }}
      TF_VAR_azure_ad_api_client_id: ${{ vars.AZURE_AD_API_CLIENT_ID }}
      TF_VAR_ai_provider: "OpenAI"
      TF_VAR_ai_endpoint: "https://api.openai.com/"
      TF_VAR_ai_embedding_model: "text-embedding-3-small"
      TF_VAR_ai_answer_model: "gpt-4.1-nano"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate required deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          required=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP
            AZURE_ACR_NAME
            AZURE_TF_STATE_STORAGE_ACCOUNT
            AZURE_TF_STATE_CONTAINER
            AZURE_TF_STATE_KEY
            AZURE_AD_TENANT_ID
            AZURE_AD_API_CLIENT_ID
            AI_PROVIDER
            AI_ENDPOINT
            AI_EMBEDDING_MODEL
            AI_ANSWER_MODEL
            POSTGRES_ADMIN_PASSWORD
          )

          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub environment value: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure Terraform AI credential
        shell: bash
        env:
          APPLY_REQUESTED: ${{ inputs.apply || startsWith(github.ref, 'refs/tags/azure-apply-') }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [ "$APPLY_REQUESTED" = "true" ]; then
            if [ -z "${OPENAI_API_KEY:-}" ]; then
              echo "::error::Missing GitHub environment value: OPENAI_API_KEY"
              exit 1
            fi

            echo "::add-mask::$OPENAI_API_KEY"
            echo "TF_VAR_ai_api_key=$OPENAI_API_KEY" >> "$GITHUB_ENV"
          else
            echo "TF_VAR_ai_api_key=plan-only-placeholder" >> "$GITHUB_ENV"
          fi

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure context
        shell: bash
        run: |
          set -euo pipefail
          az account show \
            --query '{subscription:id,tenant:tenantId,name:name}' \
            --output table

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialize Terraform remote state
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir=infra/azure/platform init \
            -reconfigure \
            -backend-config="use_cli=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="tenant_id=$AZURE_TENANT_ID" \
            -backend-config="storage_account_name=$AZURE_TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$AZURE_TF_STATE_CONTAINER" \
            -backend-config="key=$AZURE_TF_STATE_KEY"

      - name: Validate Terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/azure/platform validate

      - name: Plan Azure platform
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/azure/platform plan \
            -out=cloudknowledge.tfplan

      - name: Stop after plan for review
        if: ${{ !(inputs.apply || startsWith(github.ref, 'refs/tags/azure-apply-')) }}
        shell: bash
        run: |
          echo "### CloudKnowledge Azure plan only" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No Azure platform resources were applied by this run." >> "$GITHUB_STEP_SUMMARY"
          echo "Review the Terraform plan in the 'Plan Azure platform' step." >> "$GITHUB_STEP_SUMMARY"
          echo "Before PR #6 is merged, push an azure-apply-* tag on the reviewed commit to apply." >> "$GITHUB_STEP_SUMMARY"
          echo "After the workflow exists on main, a manual run with apply=true is also supported." >> "$GITHUB_STEP_SUMMARY"

      - name: Login to Azure Container Registry
        if: ${{ inputs.apply || startsWith(github.ref, 'refs/tags/azure-apply-') }}
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$AZURE_ACR_NAME"

      - name: Build and push immutable images
        if: ${{ inputs.apply || startsWith(github.ref, 'refs/tags/azure-apply-') }}
        shell: bash
        run: |
          set -euo pipefail

          ACR_SERVER=$(az acr show \
            --name "$AZURE_ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query loginServer \
            --output tsv)

          echo "ACR_SERVER=$ACR_SERVER" >> "$GITHUB_ENV"

          docker build \
            --file src/CloudKnowledge.Api/Dockerfile \
            --tag "$ACR_SERVER/cloudknowledge-api:${GITHUB_SHA}" \
            .

          docker build \
            --file src/CloudKnowledge.Worker/Dockerfile \
            --tag "$ACR_SERVER/cloudknowledge-worker:${GITHUB_SHA}" \
            .

          docker build \
            --file src/CloudKnowledge.Web/Dockerfile \
            --tag "$ACR_SERVER/cloudknowledge-web:${GITHUB_SHA}" \
            .

          docker push "$ACR_SERVER/cloudknowledge-api:${GITHUB_SHA}"
          docker push "$ACR_SERVER/cloudknowledge-worker:${GITHUB_SHA}"
          docker push "$ACR_SERVER/cloudknowledge-web:${GITHUB_SHA}"

      - name: Apply Azure platform
        if: ${{ inputs.apply || startsWith(github.ref, 'refs/tags/azure-apply-') }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/azure/platform apply \
            -auto-approve \
            cloudknowledge.tfplan

      - name: Run database migrations
        if: ${{ inputs.apply || startsWith(github.ref, 'refs/tags/azure-apply-') }}
        shell: bash
        run: |
          set -euo pipefail

          JOB_NAME=$(terraform -chdir=infra/azure/platform output -raw migration_job_name)
          EXECUTION_NAME=$(az containerapp job start \
            --name "$JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query name \
            --output tsv)

          if [ -z "$EXECUTION_NAME" ]; then
            echo "::error::Azure did not return a migration job execution name."
            exit 1
          fi

          echo "Migration execution: $EXECUTION_NAME"

          for attempt in $(seq 1 60); do
            STATUS=$(az containerapp job execution show \
              --name "$JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --job-execution-name "$EXECUTION_NAME" \
              --query properties.status \
              --output tsv)

            echo "Migration status [$attempt/60]: $STATUS"

            case "$STATUS" in
              Succeeded)
                exit 0
                ;;
              Failed|Degraded|Stopped)
                echo "::error::Database migration execution ended with status '$STATUS'."
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Database migration did not complete within 10 minutes."
          exit 1

      - name: Publish deployment URL
        if: ${{ inputs.apply || startsWith(github.ref, 'refs/tags/azure-apply-') }}
        id: deployment
        shell: bash
        run: |
          set -euo pipefail

          WEB_URL=$(terraform -chdir=infra/azure/platform output -raw web_url)
          echo "web_url=$WEB_URL" >> "$GITHUB_OUTPUT"
          echo "### CloudKnowledge Azure demo" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Web URL: $WEB_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check public Web endpoint
        if: ${{ inputs.apply || startsWith(github.ref, 'refs/tags/azure-apply-') }}
        shell: bash
        env:
          WEB_URL: ${{ steps.deployment.outputs.web_url }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 18); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --max-time 20 \
              "$WEB_URL" \
              --output /dev/null; then
              echo "Web endpoint is reachable: $WEB_URL"
              exit 0
            fi

            echo "Web endpoint not ready yet [$attempt/18]."
            sleep 10
          done

          echo "::error::Public Web endpoint did not become reachable."
          exit 1
