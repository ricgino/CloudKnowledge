name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CloudKnowledge.slnx

      - name: Build
        run: dotnet build CloudKnowledge.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CloudKnowledge.slnx --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/CloudKnowledge.Web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/CloudKnowledge.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build API image
        run: >-
          docker build
          --file src/CloudKnowledge.Api/Dockerfile
          --tag cloudknowledge-api:ci
          .

      - name: Build Worker image
        run: >-
          docker build
          --file src/CloudKnowledge.Worker/Dockerfile
          --tag cloudknowledge-worker:ci
          .

      - name: Build Web image
        run: >-
          docker build
          --file src/CloudKnowledge.Web/Dockerfile
          --tag cloudknowledge-web:ci
          .
