name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CloudKnowledge.slnx

      - name: Build
        run: dotnet build CloudKnowledge.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CloudKnowledge.slnx --configuration Release --no-build
