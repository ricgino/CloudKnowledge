name: Azure Infrastructure Validation

on:
  push:
    branches:
      - feat/azure-deployment
    paths:
      - "infra/azure/**"
      - ".github/workflows/azure-validate.yml"
  pull_request:
    branches:
      - feat/team-hierarchy-document-library
      - main
    paths:
      - "infra/azure/**"
      - ".github/workflows/azure-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform format
        run: terraform fmt -check -recursive infra/azure

      - name: Validate bootstrap
        run: |
          terraform -chdir=infra/azure/bootstrap init -backend=false
          terraform -chdir=infra/azure/bootstrap validate

      - name: Validate platform
        run: |
          terraform -chdir=infra/azure/platform init -backend=false
          terraform -chdir=infra/azure/platform validate
