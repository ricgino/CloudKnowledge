name: Azure Branch Validation

on:
  push:
    branches:
      - feat/azure-deployment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore CloudKnowledge.slnx
      - name: Build
        run: dotnet build CloudKnowledge.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test CloudKnowledge.slnx --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/CloudKnowledge.Web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/CloudKnowledge.Web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build --file src/CloudKnowledge.Api/Dockerfile --tag cloudknowledge-api:ci .
      - name: Build Worker image
        run: docker build --file src/CloudKnowledge.Worker/Dockerfile --tag cloudknowledge-worker:ci .
      - name: Build Web image
        run: docker build --file src/CloudKnowledge.Web/Dockerfile --tag cloudknowledge-web:ci .

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Terraform format
        shell: bash
        run: |
          if [ -d infra/azure ]; then
            terraform fmt -check -recursive infra/azure
          fi
      - name: Validate bootstrap
        shell: bash
        run: |
          if [ -d infra/azure/bootstrap ]; then
            terraform -chdir=infra/azure/bootstrap init -backend=false
            terraform -chdir=infra/azure/bootstrap validate
          fi
      - name: Validate platform
        shell: bash
        run: |
          if [ -d infra/azure/platform ]; then
            terraform -chdir=infra/azure/platform init -backend=false
            terraform -chdir=infra/azure/platform validate
          fi
